apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: faraja
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: faraja-config   # POSTGRES_DB
            - secretRef:
                name: faraja-secret   # POSTGRES_USER, POSTGRES_PASSWORD
          env:
            - name: PGDATA            # subfolder, because the EBS disk root isn't empty
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h localhost -U $POSTGRES_USER"]
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: faraja-pvc
        - name: init-sql
          configMap:
            name: postgres-init
