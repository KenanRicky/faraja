apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: faraja
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
 
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres            # Pod will be named postgres-0
  namespace: faraja
  labels:
    app: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  # StatefulSets only support RollingUpdate and OnDelete. "Recreate" is a
  # Deployment-only strategy and is rejected here. OnDelete is the closest
  # equivalent: the old Pod is fully removed before the new one starts,
  # so two Postgres instances never share the same data volume.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: faraja-config     # POSTGRES_DB
            - secretRef:
                name: faraja-secret     # POSTGRES_USER, POSTGRES_PASSWORD
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              # -h localhost forces a TCP check, so the Pod is only Ready once
              # the real server is up (not the temporary init server).
              command: ["sh", "-c", "pg_isready -h localhost -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h localhost -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: faraja-pvc    # must match your PVC's name
        - name: init-sql
          configMap:
            name: postgres-init         # created from init.sql
