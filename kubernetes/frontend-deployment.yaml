apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: faraja
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: kenanricky/faraja-frontend:v1.1.0
          ports:
            - containerPort: 3000
          env:
            - name: API_INTERNAL_URL   # how the frontend reaches the backend
              value: http://backend-service
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
