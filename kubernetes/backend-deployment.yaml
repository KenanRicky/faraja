apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: faraja
  labels:
    app: faraja
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kenanricky/faraja-backend:v1.1.0
        ports:
        - containerPort: 8000
