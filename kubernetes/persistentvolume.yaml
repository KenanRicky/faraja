apiVersion: v1
kind: PersistentVolume
metadata:
  name: faraja-pv            # PVs are cluster-wide, so no namespace
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain   # keep the data if the PVC is deleted
  storageClassName: ""                    # static, so no provisioner
  hostPath:                               # fine on minikube (single node)
    path: /data/faraja-postgres
  claimRef:                               # reserve this PV for faraja-pvc only
    namespace: faraja
    name: faraja-pvc
