apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - servicemonitor.yaml
  - alert-rules.yaml

# Grafana's sidecar loads any ConfigMap labelled grafana_dashboard=1,
# so the dashboard appears without a manual import
configMapGenerator:
  - name: faraja-dashboard
    namespace: monitoring
    files:
      - dashboards/faraja-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
