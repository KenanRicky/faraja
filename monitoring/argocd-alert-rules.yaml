apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: argocd.rules
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app {{ $labels.name }} is out of sync with Git"

        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD app {{ $labels.name }} is {{ $labels.health_status }}"

        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Argo CD failed to sync {{ $labels.name }}"

        - alert: ArgoCDMetricsDown
          expr: absent(up{job="argocd-metrics"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Prometheus cannot reach Argo CD metrics
