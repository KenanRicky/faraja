apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.16.1
    helm:
      releaseName: monitoring        # keeps names like monitoring-grafana
      valuesObject:
        prometheus:
          prometheusSpec:
            # pick up every ServiceMonitor / PrometheusRule, not just the chart's own
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        grafana:
          admin:
            existingSecret: grafana-admin   # created by hand, not in git
        alertmanager:
          alertmanagerSpec:
            # Gmail app password, created by hand, mounted at /etc/alertmanager/secrets/alertmanager-smtp/
            secrets:
              - alertmanager-smtp
          config:
            global:
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: kaburaricky@gmail.com
              smtp_auth_username: kaburaricky@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
              smtp_require_tls: true
            route:
              receiver: "null"
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # Only warning and critical alerts are emailed; Watchdog and info alerts are dropped
                - receiver: email
                  matchers:
                    - severity =~ "warning|critical"
                    - alertname != "Watchdog"
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: kaburaricky@gmail.com
                    send_resolved: true   # also email when the problem clears
        # EKS hides these control-plane parts, so scraping them only raises false alerts
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true         # the chart's CRDs are too big for a normal apply
