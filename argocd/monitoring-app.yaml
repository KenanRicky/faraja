apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faraja-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KenanRicky/faraja.git
    targetRevision: master
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServiceMonitor/PrometheusRule types come from kube-prometheus-stack; wait for them
      - SkipDryRunOnMissingResource=true
