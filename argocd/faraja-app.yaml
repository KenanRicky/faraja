apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faraja
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KenanRicky/faraja.git
    targetRevision: master
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: faraja
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
