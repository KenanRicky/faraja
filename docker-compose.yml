services:
  database:
    build: ./database
    image: kenanricky/faraja-database:v1.1.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - faraja-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
  backend:
    build: ./backend
    image: kenanricky/faraja-backend:v1.1.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:8000"
    networks:
      - faraja-net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    image: kenanricky/faraja-frontend:v1.1.0
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT}:3000"
    networks:
      - faraja-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
     interval: 5s
     timeout: 5s
     retries: 10
     start_period: 30s

networks:
  faraja-net:

volumes:
  db-data:
